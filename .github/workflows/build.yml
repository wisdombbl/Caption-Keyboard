name: Build Caption Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project ZIP
        run: |
          if [ ! -f Caption-Keyboard-Android-Project.zip ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -o Caption-Keyboard-Android-Project.zip -d android-project

      - name: Find Android project
        run: |
          FILE=$(find android-project -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin targets
        run: |
          cat > fix.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.matching {
                  it.name.toLowerCase().contains('compile') &&
                  it.name.toLowerCase().contains('kotlin')
              }.configureEach {
                  kotlinOptions.jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle -I fix.gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK successfully generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Keyboard-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
