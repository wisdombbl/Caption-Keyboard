name: Build Caption Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -o Caption-Keyboard-Android-Project.zip -d android-project

      - name: Find Android project
        run: |
          FILE=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Keyboard-APK
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
