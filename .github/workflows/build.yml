name: Build Caption Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -o Caption-Keyboard-Android-Project.zip -d android-project

      - name: Find Android project
        run: |
          FILE=$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin targets
        run: |
          cat > fix.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
              tasks.matching {
                  it.name.toLowerCase().contains('compile') &&
                  it.name.toLowerCase().contains('kotlin')
              }.configureEach {
                  kotlinOptions.jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: gradle -I fix.gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Keyboard-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
