name: Build Caption Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Find project ZIP
        id: project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f \
            -name 'Caption-Keyboard-Android-Project.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -o "${{ steps.project.outputs.zip }}" \
            -d android-project

      - name: Locate Gradle project
        id: android
        shell: bash
        run: |
          FILE=$(find android-project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Align Java compilation target
        shell: bash
        run: |
          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          cat >> "$APP" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
        env:
          PROJECT_DIR: ${{ steps.android.outputs.project_dir }}

      - name: Build APK
        run: |
          gradle \
            -p "${{ steps.android.outputs.project_dir }}" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          APK=$(find android-project -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Keyboard-APK
          path: ${{ steps.verify.outputs.APK }}
          if-no-files-found: error
          retention-days: 14
